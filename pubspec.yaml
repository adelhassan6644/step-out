  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter
  flutter_clean_architecture:
  flutter_calendar_carousel:
  dio:
  internet_connection_checker:
  fluttertoast: ^8.2.1
  dartz:
  pretty_dio_logger: ^1.3.1
  shared_preferences:
  get_it:
  http:
  firebase_messaging: ^15.1.5
  provider: ^6.1.1
  flutter_staggered_animations:
  connectivity:
  image_picker:
  cached_network_image:
  flutter_styled_toast:
#  flutter_animated_dialog:
  flutter_animate:
  url_launcher: ^6.1.11
  readmore:
  flutter_svg:
  flutter_local_notifications: ^18.0.1
  flutter_form_builder:
  equatable:
  pin_code_fields:
  cupertino_icons: ^1.0.2
  modal_bottom_sheet: ^3.0.0-pre
  shimmer:
  carousel_slider: ^5.0.0
  firebase_auth: ^5.3.3
  whatsapp_unilink: ^2.1.0
  firebase_dynamic_links: ^6.0.10
  firebase_analytics: ^11.3.5
#  syncfusion_flutter_sliders: ^27.2.3
  flutter_typeahead:
  geolocator_platform_interface:
  geolocator: ^13.0.2
  google_maps_flutter: ^2.10.0
  map_launcher: ^3.5.0
  flutter_polyline_points:
  country_picker: ^2.0.20
  flag:
  flutter_spinkit:
  app_settings: ^5.1.1
  substring_highlight: ^1.0.33
  motion_toast: ^2.6.8
  flutter_inappwebview: ^6.1.5

  flutter_zoom_drawer: ^3.1.1
  flutter_widget_from_html: ^0.15.3
  file_picker: ^8.1.4
  permission_handler: ^11.3.1
  path_provider: ^2.0.15
  firebase_core: ^3.8.0
  rxdart: ^0.27.7
  scroll_to_index: ^3.0.1
  should_rebuild: ^1.0.1
  syncfusion_flutter_sliders: ^27.2.3
  share_plus: ^10.1.2
  lottie: ^3.1.3
  flutter_native_splash: ^2.3.6
  huawei_push: ^6.11.0+300

dependency_overrides:
  galleryimage: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/svgs/
    - assets/images/
    - assets/json/
    - assets/language/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/en/Roboto-Thin.ttf
          weight: 300
        - asset: assets/fonts/en/Roboto-Regular.ttf
          weight: 500
        - asset: assets/fonts/en/Roboto-Medium.ttf
          weight: 600
        - asset: assets/fonts/en/Roboto-Light.ttf
          weight: 600
        - asset: assets/fonts/en/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/en/Roboto-Black.ttf
          weight: 800

    - family: ar
      fonts:
        - asset: assets/fonts/ar/w300.ttf
          weight: 300
        - asset: assets/fonts/ar/w400.ttf
          weight: 400
        - asset: assets/fonts/ar/w500.ttf
          weight: 500
        - asset: assets/fonts/ar/w600.ttf
          weight: 600
        - asset: assets/fonts/ar/w700.ttf
          weight: 700
